<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local HS Football</title>
  <meta http-equiv="refresh" content="600">

  <style>
    /*
      To use the licensed Sequel 100 Black 85 webfont, place the WOFF2 file at:
      fonts/Sequel100Black85.woff2
    */
    @font-face {
      font-family: "Sequel 100 Black 85";
      src: url("./fonts/Sequel100Black85.woff2") format("woff2");
      font-style: normal;
      font-weight: 900;
      font-display: swap;
    }

    :root {
      --bg: #0b0e13;
      --card: #121722;
      --ink: #e7edf6;
      --muted: #9fb0c2;
      --accent: #4fd1c5;
      --warn: #f59e0b;
      --card-min: 320px;
      --app-font: "Sequel 100 Black 85", "Arial Black", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--app-font);
      font-weight: 900;
    }

    body { min-height: 100vh; }

    .wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 20px 28px 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 14px;
    }

    .title {
      grid-column: 1 / 2;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -.035em;
    }

    .clock {
      grid-column: 2 / 3;
      justify-self: end;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-wrap {
      grid-column: 1 / 2;
      width: min(420px, 60vw);
      height: 6px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
    }

    .progress {
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    .grid {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      gap: 16px;
      padding: 8px 28px 28px;
    }

    .grid.fade-out {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .35s ease, transform .35s ease;
    }

    .grid.fade-in {
      opacity: 1;
      transform: translateY(0);
      transition: opacity .35s ease, transform .35s ease;
    }

    .card {
      min-height: 200px;
      padding: 16px 16px 14px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.05);
    }

    .team {
      margin: 4px 0 2px;
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .sub {
      margin: 6px 0 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .rowline {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .label {
      width: 76px;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .value {
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      vertical-align: top;
    }

    .table th {
      width: 92px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .3px;
      text-align: left;
    }

    .status {
      grid-column: 1 / -1;
      padding: 20px;
      color: var(--muted);
      background: var(--card);
      border-radius: 18px;
    }

    .status.error {
      color: #fecaca;
      border: 1px solid rgba(248,113,113,.35);
    }

    footer {
      padding: 8px 16px 16px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes rotProgress {
      from { width: 0; }
      to { width: 100%; }
    }

    @media (max-width: 600px) {
      header { padding: 16px 16px 8px; }
      .title { font-size: 26px; }
      .grid { padding: 8px 16px 20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Local HS Football</div>
      <div class="clock" id="clock">--:--</div>
      <div class="progress-wrap" id="progWrap" title="Time until next page">
        <div class="progress" id="progress"></div>
      </div>
    </header>

    <main class="grid" id="grid" aria-live="polite"></main>

    <footer>Data updated <span id="updated">loading...</span></footer>
  </div>

  <script>
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const office = params.get("office") || "mead-office";
    const perPage = Math.max(1, Number.parseInt(params.get("per") || "2", 10));
    const rotateSeconds = Math.max(5, Number.parseInt(params.get("rotate") || "10", 10));
    const mode = (params.get("mode") || "compact").toLowerCase();
    const cardMin = Number.parseInt(params.get("cardmin") || "0", 10);
    const useAnimation = (params.get("anim") || "on").toLowerCase() !== "off";

    if (Number.isFinite(cardMin) && cardMin > 150) {
      document.documentElement.style.setProperty("--card-min", `${cardMin}px`);
    }

    const gridElement = document.getElementById("grid");
    const updatedElement = document.getElementById("updated");
    const clockElement = document.getElementById("clock");
    const progressWrapElement = document.getElementById("progWrap");
    const progressElement = document.getElementById("progress");
    progressWrapElement.style.display = "none";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeName(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    }

    function splitIntoPages(items, size) {
      const pages = [];
      for (let index = 0; index < items.length; index += size) {
        pages.push(items.slice(index, index + size));
      }
      return pages;
    }

    async function loadJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`Could not load ${url} (${response.status})`);
      return response.json();
    }

    function showStatus(message, isError = false) {
      gridElement.innerHTML = "";
      const box = document.createElement("div");
      box.className = `status${isError ? " error" : ""}`;
      box.textContent = message;
      gridElement.appendChild(box);
    }

    function startClock() {
      function tick() {
        clockElement.textContent = new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit"
        }).format(new Date());
      }
      tick();
      window.setInterval(tick, 15000);
    }

    function parseGameDate(value) {
      const text = String(value || "").trim();
      let match = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/.exec(text);

      if (match) {
        const month = Number(match[1]);
        const day = Number(match[2]);
        let year = Number(match[3]);
        if (year < 100) year += year < 70 ? 2000 : 1900;
        const date = new Date(year, month - 1, day);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      match = /^(?:Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s+(\d{1,2})\s+([A-Za-z]{3})$/i.exec(text);
      if (match) {
        const months = {
          jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
          jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
        };
        const month = months[match[2].toLowerCase()];
        if (month === undefined) return null;
        return new Date(new Date().getFullYear(), month, Number(match[1]));
      }

      return null;
    }

    function normalizedScore(value) {
      return String(value || "")
        .replace(/&ndash;|&#8211;/gi, "-")
        .replace(/[–—]/g, "-")
        .replace(/\s+/g, "")
        .trim();
    }

    function deriveWL(score) {
      const match = /^(\d+)-(\d+)$/.exec(normalizedScore(score));
      if (!match) return "-";
      const us = Number(match[1]);
      const them = Number(match[2]);
      if (us > them) return "W";
      if (us < them) return "L";
      return "T";
    }

    function isCompleted(row) {
      const storedResult = String(row["W/L"] || "").trim().toUpperCase();
      return deriveWL(row.Score) !== "-" || ["W", "L", "T"].includes(storedResult);
    }

    function displayWL(row) {
      const derived = deriveWL(row?.Score);
      if (derived !== "-") return derived;
      const stored = String(row?.["W/L"] || "").trim().toUpperCase();
      return ["W", "L", "T"].includes(stored) ? stored : "-";
    }

    function splitLastAndNext(rows) {
      const items = rows
        .map(row => ({ row, date: parseGameDate(row.Date), done: isCompleted(row) }))
        .filter(item => item.date && !Number.isNaN(item.date.getTime()))
        .sort((a, b) => a.date - b.date);

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const completed = items.filter(item => item.done && item.date <= today);
      const last = completed.length ? completed[completed.length - 1].row : null;
      const nextItem = items.find(item => !item.done && item.date >= today);
      return { last, next: nextItem ? nextItem.row : null };
    }

    function currentRecord(rows) {
      let wins = 0;
      let losses = 0;
      let ties = 0;

      for (const row of rows) {
        const result = displayWL(row);
        if (result === "W") wins += 1;
        else if (result === "L") losses += 1;
        else if (result === "T") ties += 1;
      }

      return ties ? `${wins}-${losses}-${ties}` : `${wins}-${losses}`;
    }

    function line(label, value) {
      return `<div class="rowline"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value || "-")}</div></div>`;
    }

    function buildCompactCard(lastGame, nextGame, record) {
      const anyGame = lastGame || nextGame || {};
      const team = anyGame._team || "Unknown";
      const teamClass = anyGame._class || "?";

      const lastBlock = lastGame
        ? line("Date", lastGame.Date)
          + line("Opponent", lastGame.Opponent)
          + line("Score", normalizedScore(lastGame.Score) || "-")
          + line("W/L", displayWL(lastGame))
        : `<div class="sub">No results yet.</div>`;

      const nextBlock = nextGame
        ? line("Date", nextGame.Date) + line("Opponent", nextGame.Opponent)
        : `<div class="sub">No future games scheduled.</div>`;

      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="team">${escapeHtml(team)}</div>
        <div class="sub">Class ${escapeHtml(teamClass)} · Record ${escapeHtml(record)}</div>
        <div class="section">Last Game</div>
        ${lastBlock}
        <div class="section" style="margin-top:10px">Next Game</div>
        ${nextBlock}
      `;
      return card;
    }

    function buildFullCard(lastGame, nextGame, record) {
      const anyGame = lastGame || nextGame || {};
      const team = anyGame._team || "Unknown";
      const teamClass = anyGame._class || "?";

      function gameTable(game) {
        if (!game) return `<div class="sub">No game available.</div>`;

        const values = {
          Date: game.Date,
          Opponent: game.Opponent,
          Class: game.Class,
          "W-L": game["W-L"],
          "W/L": displayWL(game),
          Score: normalizedScore(game.Score),
          Site: game.Site,
          Time: game.Time,
          "Home/Away": game["Home/Away"]
        };

        const order = ["Date", "Opponent", "Class", "W-L", "W/L", "Score", "Site", "Time", "Home/Away"];
        const keys = order.filter(key => Object.prototype.hasOwnProperty.call(game, key) || ["W/L", "Score"].includes(key));
        const rows = keys.map(key => `<tr><th>${escapeHtml(key)}</th><td>${escapeHtml(values[key] || "-")}</td></tr>`).join("");
        return `<table class="table"><tbody>${rows}</tbody></table>`;
      }

      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="team">${escapeHtml(team)}</div>
        <div class="sub">Class ${escapeHtml(teamClass)} · Record ${escapeHtml(record)}</div>
        <div class="section" style="margin-top:12px">Last Game</div>
        ${gameTable(lastGame)}
        <div class="section" style="margin-top:12px">Next Game</div>
        ${gameTable(nextGame)}
      `;
      return card;
    }

    function buildMissingCard(teamName) {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="team">${escapeHtml(teamName)}</div>
        <div class="sub">No match found. Check the school name in teams.json.</div>
      `;
      return card;
    }

    async function init() {
      startClock();
      showStatus("Loading football schedules...");

      try {
        const [teamsConfig, data] = await Promise.all([
          loadJson("./teams.json"),
          loadJson("./data/football.json")
        ]);

        updatedElement.textContent = data.updated
          ? new Date(data.updated * 1000).toLocaleString()
          : "unknown";

        const configuredTeams = Array.isArray(teamsConfig[office]) ? teamsConfig[office] : [];
        const wantedTeams = configuredTeams.map(name => ({ name, key: normalizeName(name) }));

        if (!wantedTeams.length) {
          showStatus(`No teams are configured for "${office}". Add this office key to teams.json.`, true);
          return;
        }

        const pages = splitIntoPages(wantedTeams, perPage);
        let pageIndex = 0;
        let warningTimer = null;

        function renderPage() {
          if (useAnimation) {
            gridElement.classList.remove("fade-in");
            gridElement.classList.add("fade-out");
          }

          window.setTimeout(() => {
            gridElement.innerHTML = "";
            const page = pages[pageIndex] || [];

            for (const configuredTeam of page) {
              const rows = data.by_team?.[configuredTeam.key] || [];
              if (!rows.length) {
                gridElement.appendChild(buildMissingCard(configuredTeam.name));
                continue;
              }

              const games = splitLastAndNext(rows);
              const record = currentRecord(rows);
              const card = mode === "full"
                ? buildFullCard(games.last, games.next, record)
                : buildCompactCard(games.last, games.next, record);
              gridElement.appendChild(card);
            }

            if (useAnimation) {
              gridElement.classList.remove("fade-out");
              gridElement.classList.add("fade-in");
            }
          }, useAnimation ? 350 : 0);
        }

        function startProgress() {
          if (pages.length <= 1) {
            progressWrapElement.style.display = "none";
            return;
          }

          progressWrapElement.style.display = "block";
          progressElement.style.backgroundColor = "var(--accent)";
          progressElement.style.animation = "none";
          void progressElement.offsetWidth;
          progressElement.style.animation = `rotProgress ${rotateSeconds}s linear forwards`;

          if (warningTimer) window.clearTimeout(warningTimer);
          warningTimer = window.setTimeout(() => {
            progressElement.style.backgroundColor = "var(--warn)";
          }, Math.max(0, rotateSeconds * 1000 - 1500));
        }

        function scheduleNextPage() {
          startProgress();
          window.setTimeout(() => {
            pageIndex = (pageIndex + 1) % pages.length;
            renderPage();
            scheduleNextPage();
          }, rotateSeconds * 1000);
        }

        renderPage();
        if (pages.length > 1) scheduleNextPage();
      } catch (error) {
        console.error(error);
        updatedElement.textContent = "unavailable";
        showStatus(`Schedule data could not be loaded. ${error.message}`, true);
      }
    }

    init();
  </script>
</body>
</html>
