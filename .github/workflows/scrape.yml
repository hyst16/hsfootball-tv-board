name: Update Football Schedules

on:
  workflow_dispatch:

  schedule:
    # 6:15 AM Central every day
    - cron: "15 11 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NSAA Scraper
        run: |
          python scrape_nsaa.py

      - name: Commit Updated Football Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/football.json

          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update football schedules"
            git push
          fi
